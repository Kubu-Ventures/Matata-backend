services:
  app:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    ports:
      - "8081:8000"
    env_file:
      - .env
    environment:
      # S3StorageService authenticates against MinIO using AWS_ACCESS_KEY_ID /
      # AWS_SECRET_ACCESS_KEY, but MinIO's actual credentials are
      # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (set on the minio service below,
      # and now sourced from .env instead of being hardcoded here). Deriving
      # these from MINIO_ROOT_USER/PASSWORD — rather than requiring a second,
      # independently typed AWS_* pair in .env — makes MINIO_ROOT_USER/PASSWORD
      # the single source of truth and prevents the two pairs from drifting
      # out of sync (which previously caused "InvalidAccessKeyId" on every
      # upload). Falls back to minioadmin/minioadmin if .env doesn't set them,
      # matching MinIO's own default dev credentials below.
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  postgres:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_USER: matata
      POSTGRES_PASSWORD: matata
      POSTGRES_DB: matata_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matata -d matata_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Sourced from .env (with dev-friendly defaults) instead of hardcoded,
      # so this is the single place credentials are defined — app and
      # celery-ai below derive their AWS_ACCESS_KEY_ID/SECRET from the same
      # MINIO_ROOT_USER/PASSWORD values, and minio-init uses them too.
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    environment:
      # Same source-of-truth values as the minio service — see note there.
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb -p local/crisismap &&
      exit 0
      "

  # ── Mailpit — open-source local SMTP + web UI (dev/CI) ──────────────────────
  # Catches all outbound email without sending anything to real inboxes.
  # Web UI: http://localhost:8025
  # SMTP:   localhost:1025
  # In production, replace with your self-hosted Postal instance by pointing
  # SMTP_HOST / SMTP_PORT / SMTP_USERNAME / SMTP_PASSWORD at it.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  celery-gis:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: >
      celery -A app.workers.celery_app worker
      -Q gis --concurrency 2 --loglevel info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-ai:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: >
      celery -A app.workers.celery_app worker
      -Q ai --concurrency 2 --loglevel info
    env_file:
      - .env
    environment:
      # This worker downloads report photos from MinIO
      # (StorageService.download_image in ai_tasks.py) so it needs the same
      # credential source as the app service — derived from
      # MINIO_ROOT_USER/PASSWORD rather than a separately typed AWS_* pair in
      # .env, to avoid "InvalidAccessKeyId" drift between the two.
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-duplicate:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: >
      celery -A app.workers.celery_app worker
      -Q duplicate --concurrency 2 --loglevel info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-notifications:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: >
      celery -A app.workers.celery_app worker
      -Q notifications --concurrency 2 --loglevel info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
