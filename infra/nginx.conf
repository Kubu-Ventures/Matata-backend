# infra/nginx.conf
# Mozilla Intermediate TLS configuration — https://ssl-config.mozilla.org/
# Accommodates 15 MB image uploads per spec §8.1.2 (client_max_body_size 20m)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Rate Limiting — defence-in-depth ─────────────────────
    # 10 requests/second per IP; burst of 20 queued before 429.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # Stricter zone for auth endpoints
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ── Upstream ──────────────────────────────────────────────
    upstream app {
        server app:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ── TLS — Mozilla Intermediate ────────────────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        # Disable weak cipher suites — Mozilla Intermediate profile
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        ssl_stapling on;
        ssl_stapling_verify on;

        # ── Security Headers ──────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ── Request size — accommodates 15 MB image uploads ──
        client_max_body_size 20m;

        # ── Proxy headers ─────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ── Auth endpoints — strict rate limit ────────────────
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://app;
        }

        # ── API endpoints ─────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://app;
            proxy_read_timeout 120s;   # Allow longer for AI inference tasks
        }

        # ── Health check — no rate limit, no auth ─────────────
        location /health {
            proxy_pass http://app;
            access_log off;
        }

        # ── Docs (disable in production if desired) ───────────
        location /docs {
            proxy_pass http://app;
        }

        location /openapi.json {
            proxy_pass http://app;
        }

        # ── Default ───────────────────────────────────────────
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app;
        }
    }
}