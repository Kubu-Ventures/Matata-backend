# Production override — use with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file only declares CHANGES relative to docker-compose.yml.
# Keys not mentioned here are inherited unchanged.

services:

  # ── Application ─────────────────────────────────────────────
  app:
    build:
      context: .
      target: production          # Use the hardened production Dockerfile stage
    volumes: []                   # No code mount in production; image is immutable
    restart: unless-stopped
    environment:
      WEB_CONCURRENCY: "4"        # Gunicorn worker count; tune to (2 × vCPU) + 1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s           # Give migrations time to complete on first boot
    # entrypoint.sh handles pg_isready + alembic upgrade head before Gunicorn starts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      libretranslate:
        condition: service_started   # Don't block startup; app degrades gracefully if LT is still downloading packs

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    restart: unless-stopped
    ports: []                     # Not exposed externally in production
    shm_size: "256m"              # Recommended for PostGIS workloads
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Redis ────────────────────────────────────────────────────
  redis:
    restart: unless-stopped
    ports: []                     # Not exposed externally in production

  # ── MinIO — self-hosted S3-compatible object storage ─────────
  # Stores reporter photo uploads. Fully compatible with the S3StorageService;
  # no code changes needed to switch between MinIO and AWS S3.
  #
  # Admin console: http://<vps-ip>:9001  (protect with firewall in production)
  # After first boot, create the bucket once:
  #   docker exec -it <minio-container> mc alias set local http://localhost:9000 \
  #       "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
  #   docker exec -it <minio-container> mc mb local/crisismap
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"               # Admin console — block with ufw in production
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── LibreTranslate — self-hosted translation engine ──────────
  # Powers multilingual error messages and UI strings for all 30+ supported
  # languages. Runs entirely on-VPS; no text leaves the deployment boundary.
  #
  # First boot downloads language model packages (~2 GB). The service becomes
  # healthy only after all packs are downloaded, so start_period is generous.
  # LT_LOAD_ONLY limits RAM usage by pre-loading only the languages in use.
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    ports: []                     # Internal only; not exposed publicly
    environment:
      LT_DISABLE_WEB_UI: "true"
      LT_SUGGESTIONS: "false"
      LT_LOAD_ONLY: "en,fr,es,de,pt,ar"
    volumes:
      - libretranslate_data:/home/libretranslate/.local/share/argos-translate
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/languages || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 1800s         # First boot downloads ~2 GB of language packs; allow 30 min

  # ── Nginx Reverse Proxy ──────────────────────────────────────
  # Requires a domain name and TLS certificates in ./infra/certs/.
  # Not started by default — enable with: --profile proxy
  # When working from a bare IP (no domain), access the app on port 8000 directly.
  nginx:
    profiles: [proxy]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro   # Mount TLS certificates here
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -sf http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Ollama — local open-source vision model (free AI fallback) ──────────────
  # Runs the LLaVA vision model on-VPS so the AI pipeline always has a real
  # model available even without a paid OpenAI / Anthropic API key.
  # CPU-only mode works fine for occasional damage-image analysis.
  #
  # IMPORTANT — first-boot model download:
  #   The ollama-model-init container pulls LLaVA (~4.7 GB) on first start.
  #   This only happens once; the weights are cached in the ollama_data volume.
  #   Allow 5–15 minutes on first boot before submitting test images.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: []                         # Internal only — not exposed to the internet
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  # Pulls the vision model into the shared volume on first boot, then exits.
  # On subsequent restarts the model is already cached — exits in seconds.
  ollama-model-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "llava"]

  # ── Celery Workers ───────────────────────────────────────────
  celery-gis:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker",
              "--queues", "gis",
              "--concurrency", "2",
              "--loglevel", "info"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  celery-ai:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker",
              "--queues", "ai",
              "--concurrency", "2",
              "--loglevel", "info"]
    env_file:
      - .env
    environment:
      # In production, default to the local Ollama service so real AI analysis
      # always works without a paid API key. Override in .env to "openai" or
      # "anthropic" to use a paid provider (Ollama remains the automatic fallback).
      VISION_PROVIDER: "${VISION_PROVIDER:-ollama}"
      # Always point at the Ollama Docker service — overrides any localhost URL
      # that may be set in .env (which would not resolve inside the container).
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_VISION_MODEL: "${OLLAMA_VISION_MODEL:-llava}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  celery-duplicate:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker",
              "--queues", "duplicate",
              "--concurrency", "2",
              "--loglevel", "info"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  celery-notifications:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker",
              "--queues", "notifications",
              "--concurrency", "2",
              "--loglevel", "info"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  celery-export:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker",
              "--queues", "export",
              "--concurrency", "2",
              "--loglevel", "info"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

volumes:
  postgres_data:
    labels:
      backup: "true"              # Label used by backup tooling to identify this volume
  minio_data:
    labels:
      backup: "true"
  libretranslate_data:            # Persists downloaded language model packages
  ollama_data:                    # Persists pulled model weights (~4.7 GB for llava)
    labels:
      backup: "false"             # Model weights are re-downloadable; skip backup
