# Production override — use with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file only declares CHANGES relative to docker-compose.yml.
# Keys not mentioned here are inherited unchanged.

services:

  # ── Application ─────────────────────────────────────────────
  app:
    build:
      context: .
      target: production          # Use the hardened production Dockerfile stage
    volumes: []                   # No code mount in production; image is immutable
    restart: unless-stopped
    environment:
      WEB_CONCURRENCY: "4"        # Gunicorn worker count; tune to (2 × vCPU) + 1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s           # Give migrations time to complete on first boot
    # entrypoint.sh handles pg_isready + alembic upgrade head before Gunicorn starts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    restart: unless-stopped
    ports: []                     # Not exposed externally in production
    shm_size: "256m"              # Recommended for PostGIS workloads
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Redis ────────────────────────────────────────────────────
  redis:
    restart: unless-stopped
    ports: []                     # Not exposed externally in production

  # ── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro   # Mount TLS certificates here
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -sf http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Workers ───────────────────────────────────────────
  celery-gis:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker",
              "--queues", "gis",
              "--concurrency", "2",
              "--loglevel", "info"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  celery-ai:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker",
              "--queues", "ai",
              "--concurrency", "2",
              "--loglevel", "info"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  celery-notifications:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker",
              "--queues", "notifications",
              "--concurrency", "2",
              "--loglevel", "info"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  celery-export:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker",
              "--queues", "export",
              "--concurrency", "2",
              "--loglevel", "info"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

volumes:
  postgres_data:
    labels:
      backup: "true"              # Label used by backup tooling to identify this volume